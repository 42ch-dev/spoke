version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly

  # rust-gen declares its own [workspace], so it is outside the root members.
  - package-ecosystem: cargo
    directory: "/tooling/codegen/rust-gen"
    schedule:
      interval: weekly
    ignore:
      # typify 0.9+ changes the rendered typespace tokens that
      # src/main.rs normalizes; that upgrade needs the passes rewritten.
      - dependency-name: "typify"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
