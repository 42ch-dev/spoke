name: Artifact freshness

# Nightly check that each committed native artifact's recorded build inputs
# still describe the tree. Each lane compares the revisions recorded in its
# committed provenance sidecar — sourceRevision and recipeRevision per
# carrier — to HEAD over that carrier's compiled-source and recipe path sets.
# An unrelated commit, a test-only change or another platform's refresh never
# reports the lane stale; a real build-input change after a recorded revision
# does.
#   recorded revision stale                     → ::error:: + summary, red
#   missing/malformed/unresolvable record       → ::error:: + summary, red
#   check could not run (checker exit 2)        → ::error::, red
# No issue is opened: contents: read is the whole permission set, so the red
# run and the step summary are the only alert channel.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history: the recorded revisions must resolve in this clone.
          fetch-depth: 0

      - name: Setup Node.js
        # actions/setup-node@v4.4.0 — Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Compare provenance baselines
        run: |
          set -uo pipefail

          echo "## Artifact freshness" >> "$GITHUB_STEP_SUMMARY"

          report="$(mktemp)"
          status=0
          node tooling/release/check-artifact-freshness.mjs --repo . > "$report" || status=$?

          failed=0
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then failed=1; fi
          if ! jq -e '.lanes' "$report" > /dev/null 2>&1; then failed=1; fi

          if [ "$failed" -eq 1 ]; then
            # The checker prints its own error JSON; a crash may leave raw text.
            detail="$(jq -r '.error // empty' "$report" 2>/dev/null || true)"
            if [ -z "$detail" ]; then
              detail="$(head -c 500 "$report" 2>/dev/null | tr '\n' ' ' || true)"
            fi
            echo "::error::artifact freshness check failed to run: ${detail}"
            echo "- :x: **artifact freshness** check failed to run: ${detail}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          jq -r '.lanes[] as $lane
            | if $lane.status == "fresh" then
                "- :white_check_mark: **\($lane.lane)** fresh"
              elif $lane.status == "stale" then
                "- :x: **\($lane.lane)** stale\n" +
                ($lane.stale | map("  - base `\(.base)` (`\(.label)`) changed by `\(.commit)`") | join("\n"))
              else
                "- :x: **\($lane.lane)** invalid provenance\n" +
                ($lane.errors | map("  - \(.)") | join("\n"))
              end' "$report" >> "$GITHUB_STEP_SUMMARY"

          jq -r '.lanes[] as $lane
            | ($lane.errors[] | "::error::\($lane.lane): invalid provenance: \(.)"),
              ($lane.stale[] | "::error::\($lane.lane): build inputs changed since \(.base) (\(.label)) (commit \(.commit))")' "$report"

          if [ "$status" -eq 1 ]; then
            echo "::error::artifact freshness check reported stale or invalid provenance"
            exit 1
          fi
