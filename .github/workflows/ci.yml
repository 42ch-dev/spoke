name: CI

on:
  # Unfiltered on pull requests: verify-codegen / typescript / rust /
  # verify-version / connect-identity / golden-vector-sync are required checks,
  # and a required context a path filter skips can never be satisfied. The
  # docs-only optimization survives on the push side below.
  pull_request:
  push:
    branches:
      - main
      - iteration/**
    paths-ignore:
      - 'docs/**'
      - 'tooling/docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-codegen:
    name: verify-codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify codegen output
        run: pnpm run verify-codegen

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrored by the root `ci:typescript` script (package.json) — update in lockstep.
      - name: Typecheck @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas typecheck

      - name: Build @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas build

      - name: Typecheck @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations typecheck

      - name: Test @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations test

      - name: Build @42ch/spoke-operations
        # Must precede the spoke-connect build + dist smoke: the ./remote
        # subpath (RemoteAdapter) imports @42ch/spoke-operations, so its
        # dist/ must exist before test:dist resolves the exports map.
        run: pnpm -F @42ch/spoke-operations build

      - name: Test release scripts
        run: pnpm run test:release

      - name: Test toy-world fixtures
        run: pnpm run test:fixtures

      - name: Typecheck @42ch/spoke-connect
        run: pnpm -F @42ch/spoke-connect typecheck

      - name: Test @42ch/spoke-connect
        run: pnpm run test:connect-ts

      - name: Build @42ch/spoke-connect
        run: pnpm -F @42ch/spoke-connect build

      - name: Smoke @42ch/spoke-connect published shape (dist)
        # Published-shape gate: resolves the package exports map against the
        # built dist/ (ESM + CJS) — not the vitest source aliases. Fails if a
        # require/import condition or a dist file is dropped.
        run: pnpm -F @42ch/spoke-connect test:dist

  connect-identity:
    name: connect-identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history so the path-filter diff below can compare base vs head.
          fetch-depth: 0

      - name: Setup Node.js
        # actions/setup-node@v4.4.0 — Node 24 matches the release.yml npm publish surface
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Check identity-related paths changed
        id: paths
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          fi
          # First push to a branch has an all-zero `before` sha — diff against
          # the empty tree so the gate still runs.
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          # Fail open on diff errors: if git diff cannot resolve the base/head
          # shas (e.g. force-push GC'd the old commit), run the proof anyway —
          # a regression gate that silently skips on its own filter error is
          # a vacuous pass. The warning makes the fallback visible.
          if ! changed="$(git diff --name-only "$base" "$head" 2>/dev/null)"; then
            echo "::warning::git diff failed for $base..$head; running identity proof anyway"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            matches="$(printf '%s\n' "$changed" | grep -Ec '^(tooling/connect-identity-proof/|packages/spoke-connect-ts/|\.github/workflows/ci\.yml)' || true)"
            if [[ "${matches:-0}" -gt 0 ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run connect identity proof
        if: steps.paths.outputs.run == 'true'
        run: node tooling/connect-identity-proof/proof.mjs

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Check spoke-schemas crate
        run: cargo check -p spoke-schemas

      - name: Test spoke-operations crate
        run: cargo test -p spoke-operations

      - name: Test spoke-fixture-toy-world crate
        run: cargo test -p spoke-fixture-toy-world

      - name: Test spoke-connect crate
        run: cargo test -p spoke-connect

      - name: Test spoke-connect crate (remote-adapter feature)
        run: |
          # remote-adapter must stay non-default (it pulls in spoke-operations
          # for the BaselinePorts surface); assert the Cargo.toml default here
          # so a future default-feature change trips CI, then run the
          # feature-gated suite (loopback interop + adapter unit tests).
          grep -q '^default = \[\]$' crates/spoke-connect/Cargo.toml
          cargo test -p spoke-connect --features remote-adapter

      - name: Build spoke-connect FFI facade (ffi feature)
        run: cargo build -p spoke-connect --features ffi

      - name: Test spoke-connect FFI facade (ffi feature)
        run: cargo test -p spoke-connect --features ffi

      - name: Build and test spoke-connect (ffi + remote-adapter production surface)
        run: |
          # Release build-connect-ffi and build-swift-xcframework.sh ship
          # ffi,remote-adapter together; assert the combined feature set on PRs.
          cargo build -p spoke-connect --features ffi,remote-adapter
          cargo test -p spoke-connect --features ffi,remote-adapter

      # First-party uniffi languages only (Swift, Python). C# and Go use vendored
      # uniffi-bindgen forks under bindings/{csharp,go}/bindgen/ and are excluded.
      - name: Verify binding regeneration (no drift)
        run: ./tooling/connect/verify-binding-regen.sh

  csharp-connect:
    name: csharp-connect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Setup .NET
        # actions/setup-dotnet@v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Build FFI, assemble RID, pack + PackageReference smoke
        run: |
          set -euo pipefail
          STAGING="$(mktemp -d)"
          ./tooling/connect/build-csharp-ffi-host.sh "${STAGING}"
          ./tooling/connect/assemble-csharp-runtimes.sh "${STAGING}"
          dotnet pack crates/spoke-connect/bindings/csharp/42ch.Spoke.Connect.csproj \
            -c Release -o /tmp/spoke-nuget-out
          # Golden parity via PackageReference so NuGet runtimes/<rid>/native
          # resolution is exercised (not the in-repo ProjectReference copy path).
          ./tooling/connect/smoke-nupkg-packageref.sh /tmp/spoke-nuget-out

  kotlin-connect-smoke:
    name: kotlin-connect-smoke
    runs-on: ubuntu-22.04
    env:
      # Keep the cargo target dir predictable for the -PnativeLib path below.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Setup Java
        # actions/setup-java@v4.7.0
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build production spoke-connect cdylib
        # The committed production Kotlin bindings are executed against a fresh
        # Linux cdylib (ffi,remote-adapter): no committed native and no binding
        # regeneration are part of this lane.
        run: cargo build --locked -p spoke-connect --features ffi,remote-adapter --release

      - name: Run Kotlin smoke (default Smoke source set)
        # Committed Gradle 8.10.2 wrapper (distribution pinned by SHA-256 in
        # gradle/wrapper/gradle-wrapper.properties); no smokeHost property, so
        # the default Smoke set runs against the built cdylib.
        working-directory: crates/spoke-connect/bindings/kotlin
        run: |
          ./gradlew --no-daemon --rerun-tasks test \
            -PnativeLib="${{ github.workspace }}/target/release/libspoke_connect.so"

      - name: Verify KE smoke counts
        working-directory: crates/spoke-connect/bindings/kotlin
        run: python3 verify-ke-smoke-results.py build/test-results/test

      - name: Upload JUnit XML
        # Unconditional: a failing smoke must still hand over the XML the count
        # gate reads.
        # actions/upload-artifact@v4.6.2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kotlin-connect-smoke-junit
          path: crates/spoke-connect/bindings/kotlin/build/test-results/test
          if-no-files-found: error
          retention-days: 5

  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Assert lockstep package versions
        run: node tooling/release/assert-lockstep-version.mjs

  golden-vector-sync:
    name: golden-vector-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify golden vector SSOTs and registered copies match
        run: node tooling/connect/golden-vector-sync.mjs
