name: CI

on:
  # Unfiltered on pull requests: every required context must always be reported.
  # A docs-only diff short-circuits each heavy job's run steps through the
  # `changes` job instead of skipping the check. The push side keeps the
  # paths-ignore filter below.
  pull_request:
  push:
    branches:
      - main
      - iteration/**
    paths-ignore:
      - 'docs/**'
      - 'tooling/docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: detect
        run: |
          code=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            code=true
          # --no-renames: a file moved out of a code path still reports its
          # old path, so the rename keeps counting as a code change.
          elif ! files=$(git diff --no-renames --name-only "origin/${{ github.base_ref }}"...HEAD); then
            # Fail closed: a diff failure must never be read as "docs only".
            code=true
          elif printf '%s\n' "$files" | grep -vqE '^(docs/|tooling/docs/|.*\.md$|\.mstarc$)'; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_STEP_SUMMARY"

  verify-codegen:
    needs: changes
    name: verify-codegen
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert changes gate inputs
        id: assert
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          problems=()
          [[ "${CHANGES}" == "success" ]] || problems+=("changes job result=${CHANGES}")
          [[ "${CODE}" == "true" || "${CODE}" == "false" ]] || problems+=("missing/empty code output '${CODE}'")
          if (( ${#problems[@]} )); then
            printf 'assert: %s\n' "${problems[@]}" >&2
            { echo "### Required-check assertion failed"; printf -- '- %s\n' "${problems[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify codegen output
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        # Node-only checks over committed files; the typescript/rust jobs cover
        # the typecheck and compile halves of the local `verify-codegen` script.
        run: pnpm run test:codegen

      - name: Setup Rust
        # typify renders the tokens main.rs normalizes, so a dependency bump can
        # break the generator without touching any checked-in source.
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Rebuild the committed generated tree
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: |
          pnpm run codegen
          if [[ -n "$(git status --porcelain -- crates/spoke-schemas/src/generated packages/spoke-schemas/src/generated)" ]]; then
            echo 'generated tree is stale; run `pnpm run codegen` and commit the result' >&2
            git status --porcelain -- crates/spoke-schemas/src/generated packages/spoke-schemas/src/generated >&2
            exit 1
          fi

  typescript:
    needs: changes
    name: typescript
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert changes gate inputs
        id: assert
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          problems=()
          [[ "${CHANGES}" == "success" ]] || problems+=("changes job result=${CHANGES}")
          [[ "${CODE}" == "true" || "${CODE}" == "false" ]] || problems+=("missing/empty code output '${CODE}'")
          if (( ${#problems[@]} )); then
            printf 'assert: %s\n' "${problems[@]}" >&2
            { echo "### Required-check assertion failed"; printf -- '- %s\n' "${problems[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cold-clone gate
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: pnpm run ci:typescript

  rust:
    needs: changes
    name: rust
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert changes gate inputs
        id: assert
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          problems=()
          [[ "${CHANGES}" == "success" ]] || problems+=("changes job result=${CHANGES}")
          [[ "${CODE}" == "true" || "${CODE}" == "false" ]] || problems+=("missing/empty code output '${CODE}'")
          if (( ${#problems[@]} )); then
            printf 'assert: %s\n' "${problems[@]}" >&2
            { echo "### Required-check assertion failed"; printf -- '- %s\n' "${problems[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Check spoke-schemas crate
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: cargo check -p spoke-schemas

      - name: Check spoke-connect-capi crate
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        # Excluded from default-members; the carrier lanes are not host-agnostic.
        run: cargo check -p spoke-connect-capi

      - name: Test spoke-operations crate
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: cargo test -p spoke-operations

      - name: Test spoke-fixture-memory-engine crate
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: cargo test -p spoke-fixture-memory-engine

      - name: Test spoke-fixture-toy-world crate
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: cargo test -p spoke-fixture-toy-world

      - name: Test spoke-connect crate
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: cargo test -p spoke-connect

      - name: Check spoke-connect crate (remote-adapter feature)
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: |
          # remote-adapter must stay non-default (it pulls in spoke-operations
          # for the BaselinePorts surface); assert the Cargo.toml default here
          # so a future default-feature change trips CI. Feature isolation is
          # proven by `cargo check`; the combined ffi,remote-adapter run below
          # still executes the feature-gated suites.
          grep -q '^default = \[\]$' crates/spoke-connect/Cargo.toml
          cargo check -p spoke-connect --features remote-adapter

      - name: Check spoke-connect FFI facade (ffi feature)
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: cargo check -p spoke-connect --features ffi

      - name: Build and test spoke-connect (ffi + remote-adapter production surface)
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: |
          # Release build-connect-ffi and build-swift-xcframework.sh ship
          # ffi,remote-adapter together; assert the combined feature set on PRs.
          cargo build -p spoke-connect --features ffi,remote-adapter
          cargo test -p spoke-connect --features ffi,remote-adapter

  csharp-connect:
    needs: changes
    name: csharp-connect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert changes gate inputs
        id: assert
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          problems=()
          [[ "${CHANGES}" == "success" ]] || problems+=("changes job result=${CHANGES}")
          [[ "${CODE}" == "true" || "${CODE}" == "false" ]] || problems+=("missing/empty code output '${CODE}'")
          if (( ${#problems[@]} )); then
            printf 'assert: %s\n' "${problems[@]}" >&2
            { echo "### Required-check assertion failed"; printf -- '- %s\n' "${problems[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        # actions/checkout@v4.2.2
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Setup .NET
        # actions/setup-dotnet@v4.3.1
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Build FFI, assemble RID, pack + PackageReference smoke
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          STAGING="$(mktemp -d)"
          ./tooling/connect/build-csharp-ffi-host.sh "${STAGING}"
          ./tooling/connect/assemble-csharp-runtimes.sh "${STAGING}"
          dotnet pack crates/spoke-connect/bindings/csharp/42ch.Spoke.Connect.csproj \
            -c Release -o /tmp/spoke-nuget-out
          # Golden parity via PackageReference so NuGet runtimes/<rid>/native
          # resolution is exercised (not the in-repo ProjectReference copy path).
          ./tooling/connect/smoke-nupkg-packageref.sh /tmp/spoke-nuget-out

  kotlin-connect-smoke:
    needs: changes
    name: kotlin-connect-smoke
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    env:
      # Keep the cargo target dir predictable for the -PnativeLib path below.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Assert changes gate inputs
        id: assert
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          problems=()
          [[ "${CHANGES}" == "success" ]] || problems+=("changes job result=${CHANGES}")
          [[ "${CODE}" == "true" || "${CODE}" == "false" ]] || problems+=("missing/empty code output '${CODE}'")
          if (( ${#problems[@]} )); then
            printf 'assert: %s\n' "${problems[@]}" >&2
            { echo "### Required-check assertion failed"; printf -- '- %s\n' "${problems[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        # actions/checkout@v4.2.2
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Setup Java
        # actions/setup-java@v4.7.0
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build production spoke-connect cdylib
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        # The committed production Kotlin bindings are executed against a fresh
        # Linux cdylib (ffi,remote-adapter): no committed native and no binding
        # regeneration are part of this lane.
        run: cargo build --locked -p spoke-connect --features ffi,remote-adapter --release

      - name: Run Kotlin smoke (default Smoke source set)
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        # Committed Gradle 8.10.2 wrapper (distribution pinned by SHA-256 in
        # gradle/wrapper/gradle-wrapper.properties); no smokeHost property, so
        # the default Smoke set runs against the built cdylib.
        working-directory: crates/spoke-connect/bindings/kotlin
        run: |
          ./gradlew --no-daemon --rerun-tasks test \
            -PnativeLib="${{ github.workspace }}/target/release/libspoke_connect.so"

      - name: Verify KE smoke counts
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        working-directory: crates/spoke-connect/bindings/kotlin
        run: python3 verify-ke-smoke-results.py build/test-results/test

      - name: Upload JUnit XML
        # Unconditional within the code lane: a failing smoke must still hand
        # over the XML the count gate reads.
        # actions/upload-artifact@v4.6.2
        if: always() && steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kotlin-connect-smoke-junit
          path: crates/spoke-connect/bindings/kotlin/build/test-results/test
          if-no-files-found: error
          retention-days: 5

  verify-version:
    needs: changes
    name: verify-version
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert changes gate inputs
        id: assert
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          problems=()
          [[ "${CHANGES}" == "success" ]] || problems+=("changes job result=${CHANGES}")
          [[ "${CODE}" == "true" || "${CODE}" == "false" ]] || problems+=("missing/empty code output '${CODE}'")
          if (( ${#problems[@]} )); then
            printf 'assert: %s\n' "${problems[@]}" >&2
            { echo "### Required-check assertion failed"; printf -- '- %s\n' "${problems[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Assert lockstep package versions
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: node tooling/release/assert-lockstep-version.mjs

  golden-vector-sync:
    needs: changes
    name: golden-vector-sync
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert changes gate inputs
        id: assert
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          problems=()
          [[ "${CHANGES}" == "success" ]] || problems+=("changes job result=${CHANGES}")
          [[ "${CODE}" == "true" || "${CODE}" == "false" ]] || problems+=("missing/empty code output '${CODE}'")
          if (( ${#problems[@]} )); then
            printf 'assert: %s\n' "${problems[@]}" >&2
            { echo "### Required-check assertion failed"; printf -- '- %s\n' "${problems[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify golden vector SSOTs and registered copies match
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        run: node tooling/connect/golden-vector-sync.mjs
