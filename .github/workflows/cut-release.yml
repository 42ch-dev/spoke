name: Cut release

# Opens a version-bump PR. Merge it (label `release`) to tag + publish via Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep SemVer greater than current main (e.g. 0.1.0-alpha.3 or 0.1.1)"
        required: true
        type: string
      summary:
        description: "Optional release summary (tag annotation / PR body)"
        required: false
        type: string
        default: ""

concurrency:
  group: cut-release-${{ github.event.inputs.version }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: open-release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Always compare / cut against current main tip, regardless of dispatch branch.
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate SemVer is greater than main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid SemVer: ${VERSION}"
            exit 1
          fi
          node tooling/release/assert-version-greater.mjs "$VERSION"
          TAG="v${VERSION}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Git tag ${TAG} already exists; choose a higher version."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release branch and bump
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.CUT_RELEASE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git checkout -B "$BRANCH" origin/main

          # Re-check on the release branch tip (main may have moved; assert again).
          node tooling/release/assert-version-greater.mjs "$VERSION"

          pnpm run release:bump -- "$VERSION"
          if git diff --quiet origin/main -- && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Bump produced no changes."
            exit 1
          fi

          # GraphQL createCommitOnBranch → GitHub-signed/verified commit (required_signatures).
          # Do not `git commit` + `git push`: those commits are unsigned and cannot merge to main.
          node tooling/release/push-github-signed-commit.mjs \
            --branch "$BRANCH" \
            --message "chore(release): bump version to ${VERSION}" \
            --base-ref main

      # Org policy may block GITHUB_TOKEN from creating PRs. Prefer a maintainer PAT:
      # repo secret CUT_RELEASE_TOKEN (contents:write + pull_requests:write), or ask an org
      # admin to allow "Actions can create and approve pull requests".
      - name: Ensure release label
        env:
          GH_TOKEN: ${{ secrets.CUT_RELEASE_TOKEN || github.token }}
        run: |
          gh label create release --description "Release bump PR — merge to tag and publish" --color BFD4F2 2>/dev/null || true

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.CUT_RELEASE_TOKEN || github.token }}
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          TITLE="chore(release): bump version to ${VERSION}"
          COMPARE_URL="https://github.com/${REPO}/compare/main...${BRANCH}?expand=1"
          BODY_FILE="$(mktemp)"
          {
            echo "## Release ${VERSION}"
            echo ""
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
              echo ""
            fi
            echo "Merging this PR (keep the \`release\` label) creates annotated tag \`v${VERSION}\` and runs the **Release** workflow (GitHub Release + registry publish for non-\`-rc.\` tags)."
            echo ""
            echo "Generated by **Cut release** (\`workflow_dispatch\`)."
          } > "$BODY_FILE"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE" --add-label release
            echo "Updated PR #${EXISTING}"
            echo "PR_URL=$(gh pr view "$EXISTING" --json url --jq .url)" >> "$GITHUB_ENV"
            exit 0
          fi

          ERR_FILE="$(mktemp)"
          if URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE" --label release 2>"$ERR_FILE")"; then
            echo "Opened ${URL}"
            echo "PR_URL=${URL}" >> "$GITHUB_ENV"
            exit 0
          fi

          cat "$ERR_FILE" >&2
          echo "COMPARE_URL=${COMPARE_URL}" >> "$GITHUB_ENV"
          if grep -qiE 'not permitted to create|createPullRequest' "$ERR_FILE"; then
            echo "::error::Cannot create PR with the current token. Org policy blocks GITHUB_TOKEN from creating PRs. Set repo secret CUT_RELEASE_TOKEN (PAT with Contents + Pull requests write), or ask an org admin to enable Actions → create and approve pull requests. Branch is ready: ${COMPARE_URL}"
          else
            echo "::error::gh pr create failed. Branch is ready: ${COMPARE_URL}"
          fi
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Cut release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${PR_URL:-}" ]; then
            echo "- PR: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Next: merge the PR to tag and publish." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${COMPARE_URL:-}" ]; then
            echo "- Branch ready — open PR: ${COMPARE_URL}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Or set secret \`CUT_RELEASE_TOKEN\` and re-run Cut release." >> "$GITHUB_STEP_SUMMARY"
          fi
