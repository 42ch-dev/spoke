name: Cut release

# Opens a version-bump PR. Merge it (label `release`) to tag + publish via Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep SemVer to cut (e.g. 0.1.0-alpha.3 or 0.1.1)"
        required: true
        type: string
      summary:
        description: "Optional release summary (tag annotation / PR body)"
        required: false
        type: string
        default: ""

concurrency:
  group: cut-release-${{ github.event.inputs.version }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: open-release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate SemVer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid SemVer: ${VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release branch and bump
        env:
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" origin/main

          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "::error::package.json is already ${VERSION}; nothing to bump."
            exit 1
          fi

          pnpm run release:bump -- "$VERSION"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Bump produced no changes."
            exit 1
          fi
          git commit -m "chore(release): bump version to ${VERSION}"
          git push -u origin "$BRANCH" --force-with-lease

      - name: Ensure release label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create release --description "Release bump PR — merge to tag and publish" --color BFD4F2 2>/dev/null || true

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          TITLE="chore(release): bump version to ${VERSION}"
          BODY_FILE="$(mktemp)"
          {
            echo "## Release ${VERSION}"
            echo ""
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
              echo ""
            fi
            echo "Merging this PR (keep the \`release\` label) creates annotated tag \`v${VERSION}\` and runs the **Release** workflow (GitHub Release + registry publish for non-\`-rc.\` tags)."
            echo ""
            echo "Generated by **Cut release** (\`workflow_dispatch\`)."
          } > "$BODY_FILE"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE" --add-label release
            echo "Updated PR #${EXISTING}"
            echo "PR_URL=$(gh pr view "$EXISTING" --json url --jq .url)" >> "$GITHUB_ENV"
          else
            URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE" --label release)"
            echo "Opened ${URL}"
            echo "PR_URL=${URL}" >> "$GITHUB_ENV"
          fi

      - name: Summary
        run: |
          echo "### Release PR ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: merge the PR to tag and publish." >> "$GITHUB_STEP_SUMMARY"
