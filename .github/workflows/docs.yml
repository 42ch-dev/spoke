name: Docs site

# Documentation gate: validates every documentation change — the site under
# docs/ (with its tooling) and any Markdown file elsewhere. It fails if
# `pnpm docs:build` breaks, if an EN page ships without its CN twin
# (twin-parity), or if an internal link resolves to a missing page
# (dead-link). `Build docs site` is a required check, so the pull-request
# trigger is unfiltered — a path filter would leave that context unscheduled
# and unmergeable on non-docs PRs; the push side keeps the docs-only filter.
# Deploy: on push to main, the built site is published to GitHub Pages via the
# official Pages actions (upload-pages-artifact + deploy-pages).
#
# Pages source requirement: repo Settings -> Pages -> Source must be
# "GitHub Actions" for this workflow to deploy. If the org blocks
# Actions-based Pages, fall back to pushing the built site
# (docs/.vitepress/dist) to a `gh-pages` branch and switching the Pages source
# to "Deploy from a branch" — record that decision here and in the plan notes
# before switching.
#
# All actions in this workflow are pinned to immutable commit SHAs — stricter
# than the repo's other workflows (ci.yml / release.yml mix mutable tags and
# SHAs); keep it that way for the production-facing Pages deploy.

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - docs/**
      - tooling/docs/**
      - '**/*.md'
      - .github/workflows/docs.yml
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

# Latest-wins per ref: a newer run on the same ref (a main push, or a single
# PR branch) cancels the older in-flight run for that ref, so a stale main
# build can never deploy after a fresh one. The group is ref-scoped
# (`docs-${{ github.ref }}`) so PR runs never share a group with main runs —
# a docs PR push can never cancel an in-flight main build or deploy. Deploy
# contention stays main-only through the deploy job's own `pages` group below
# (AD-P2-4). This differs from the official Pages starter's
# `cancel-in-progress: false` — we prefer the newest content on every push to
# main.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24)

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0 (same pin as ci.yml)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (node24)
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check EN↔CN twin parity
        run: node tooling/docs/twin-parity.mjs

      - name: Build docs site
        run: pnpm docs:build

      - name: Check internal links
        run: node tooling/docs/deadlink-check.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Main-only deploy serialization (AD-P2-4): this job only runs on
    # refs/heads/main, so the `pages` group only ever holds main deploys — a
    # newer main deploy cancels an in-flight one (latest main wins), while PR
    # runs (ref-scoped group above) never touch it.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
