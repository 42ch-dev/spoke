name: New release

# Opens a version-bump PR. Merge it (label `release`) to tag + publish via Release.
# Requires org setting: Allow GitHub Actions to create and approve pull requests
# so GITHUB_TOKEN may createPullRequest.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep SemVer greater than current main (e.g. 0.1.0-alpha.3 or 0.1.1)"
        required: true
        type: string
      summary:
        description: "Optional release summary (tag annotation / PR body)"
        required: false
        type: string
        default: ""

concurrency:
  group: new-release-${{ github.event.inputs.version }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: open-release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate SemVer is greater than main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid SemVer: ${VERSION}"
            exit 1
          fi
          node tooling/release/assert-version-greater.mjs "$VERSION"
          TAG="v${VERSION}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Git tag ${TAG} already exists; choose a higher version."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release branch and bump
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git checkout -B "$BRANCH" origin/main

          node tooling/release/assert-version-greater.mjs "$VERSION"
          pnpm run release:bump -- "$VERSION"
          if git diff --quiet origin/main -- && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Bump produced no changes."
            exit 1
          fi

          # GraphQL createCommitOnBranch → GitHub-signed/verified commit (required_signatures).
          node tooling/release/push-github-signed-commit.mjs \
            --branch "$BRANCH" \
            --message "chore(release): bump version to ${VERSION}" \
            --base-ref main

      - name: Ensure release label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create release --description "Release bump PR — merge to tag and publish" --color BFD4F2 2>/dev/null || true

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          TITLE="chore(release): bump version to ${VERSION}"
          COMPARE_URL="https://github.com/${REPO}/compare/main...${BRANCH}?expand=1"
          BODY_FILE="$(mktemp)"
          {
            echo "## Release ${VERSION}"
            echo ""
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
              echo ""
            fi
            echo "Merging this PR (keep the \`release\` label) creates annotated tag \`v${VERSION}\` and runs the **Release** workflow (GitHub Release + registry publish for non-\`-rc.\` tags)."
            echo ""
            echo "Generated by **New release** (\`workflow_dispatch\`)."
          } > "$BODY_FILE"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE" --add-label release
            echo "Updated PR #${EXISTING}"
            echo "PR_URL=$(gh pr view "$EXISTING" --json url --jq .url)" >> "$GITHUB_ENV"
            exit 0
          fi

          URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE" --label release)"
          echo "Opened ${URL}"
          echo "PR_URL=${URL}" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          echo "### New release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${PR_URL:-}" ]; then
            echo "- PR: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Next: merge the PR to tag and publish (or close to abort)." >> "$GITHUB_STEP_SUMMARY"
          fi
