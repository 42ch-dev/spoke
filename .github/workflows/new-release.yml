name: New release

# One-shot lockstep bump on main → annotated tag → Release.
#
# Why not open a PR with GITHUB_TOKEN?
# Org setting "Allow GitHub Actions to create and approve pull requests" is off
# (GitHub default for new orgs). Repo cannot override; github-actions cannot be
# added as a ruleset bypass actor. Without that org checkbox (or a PAT),
# createPullRequest always fails. This workflow therefore lands a GitHub-signed
# commit on main via createCommitOnBranch (satisfies required_signatures), tags,
# and calls release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep SemVer greater than current main (e.g. 0.1.0-alpha.3 or 0.1.1)"
        required: true
        type: string
      summary:
        description: "Optional release summary (tag annotation)"
        required: false
        type: string
        default: ""

concurrency:
  group: new-release-${{ github.event.inputs.version }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  cut:
    name: cut
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate SemVer is greater than main
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid SemVer: ${VERSION}"
            exit 1
          fi
          node tooling/release/assert-version-greater.mjs "$VERSION"
          TAG="v${VERSION}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Git tag ${TAG} already exists; choose a higher version."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump on main (GitHub-signed commit)
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git checkout -B main origin/main

          node tooling/release/assert-version-greater.mjs "$VERSION"
          pnpm run release:bump -- "$VERSION"
          if git diff --quiet origin/main -- && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Bump produced no changes."
            exit 1
          fi

          OUT="$(mktemp)"
          node tooling/release/push-github-signed-commit.mjs \
            --branch main \
            --message "chore(release): bump version to ${VERSION}" \
            --base-ref main | tee "$OUT"

          COMMIT="$(sed -n 's/^COMMIT_OID=//p' "$OUT" | tail -n 1)"
          if [ -z "$COMMIT" ]; then
            echo "::error::push-github-signed-commit did not emit COMMIT_OID="
            exit 1
          fi
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          MSG="Release ${TAG}"
          if [ -n "$SUMMARY" ]; then
            MSG="$SUMMARY"
          fi
          node tooling/release/create-annotated-tag.mjs \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --message "$MSG"

      - name: Summary
        run: |
          echo "### New release cut" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.bump.outputs.commit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: **Release** job (workflow_call)." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    needs: cut
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
