name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-codegen:
    name: verify-codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify codegen output
        run: pnpm run verify-codegen

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas typecheck

      - name: Build @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas build

      - name: Typecheck @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations typecheck

      - name: Test @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations test

      - name: Test toy-world fixtures
        run: pnpm run test:fixtures

      - name: Build @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations build

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Check spoke-schemas crate
        run: cargo check -p spoke-schemas

      - name: Test spoke-operations crate
        run: cargo test -p spoke-operations

  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Require annotated release tag
        run: |
          TAG="${{ github.ref_name }}"
          git fetch --tags --force origin
          TYPE="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "$TYPE" != "tag" ]; then
            echo "::error::Release tag ${TAG} must be an annotated tag (git tag -a), not a lightweight tag."
            echo "Found object type: ${TYPE} (expected: tag)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assert lockstep package versions
        env:
          SPOKE_RELEASE_TAG: ${{ github.ref_name }}
        run: node tooling/release/assert-lockstep-version.mjs

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - verify-codegen
      - typescript
      - rust
      - verify-version
    permissions:
      contents: write
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          BODY="$(node tooling/release/extract-changelog-notes.mjs "$TAG" || true)"
          if [ -z "$BODY" ]; then
            BODY="$(git tag -l --format='%(contents)' "$TAG" || true)"
          fi
          if [ -z "$BODY" ]; then
            BODY="Release $TAG"
          fi
          {
            echo "body<<EOF"
            printf '%s\n' "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # softprops/action-gh-release@v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}

  publish-npm:
    name: publish-npm
    runs-on: ubuntu-latest
    needs:
      - verify-codegen
      - typescript
      - rust
      - verify-version
      - release
    if: ${{ !contains(github.ref_name, '-rc.') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable npm packages
        run: |
          pnpm -F @42ch/spoke-schemas build
          pnpm -F @42ch/spoke-operations build

      - name: Publish @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    name: publish-crates
    runs-on: ubuntu-latest
    needs:
      - publish-npm
    if: ${{ !contains(github.ref_name, '-rc.') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Publish spoke-schemas crate
        run: cargo publish -p spoke-schemas
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
