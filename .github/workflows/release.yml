name: Release

# Tag push (humans/PAT) or workflow_call (Tag release on merge / Retry release).
# github.event_name is the *caller* event (e.g. pull_request), never "workflow_call" —
# always prefer inputs.tag when set.
on:
  push:
    tags:
      - v*
  workflow_call:
    inputs:
      tag:
        description: "Annotated tag to release (e.g. v0.1.0-alpha.3)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-codegen:
    name: verify-codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify codegen output
        run: pnpm run verify-codegen

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas typecheck

      - name: Build @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas build

      - name: Typecheck @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations typecheck

      - name: Test @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations test

      - name: Test toy-world fixtures
        run: pnpm run test:fixtures

      - name: Build @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations build

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Check spoke-schemas crate
        run: cargo check -p spoke-schemas

      - name: Test spoke-operations crate
        run: cargo test -p spoke-operations

  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Require annotated release tag
        run: |
          TAG="${RELEASE_TAG}"
          git fetch --tags --force origin
          TYPE="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "$TYPE" != "tag" ]; then
            echo "::error::Release tag ${TAG} must be an annotated tag (git tag -a), not a lightweight tag."
            echo "Found object type: ${TYPE} (expected: tag)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assert lockstep package versions
        env:
          SPOKE_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: node tooling/release/assert-lockstep-version.mjs

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - verify-codegen
      - typescript
      - rust
      - verify-version
    permissions:
      contents: write
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create GitHub Release
        # Idempotent for Retry release: skip when the tag already has a GitHub Release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; leaving notes unchanged."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          NOTES="$(node tooling/release/extract-changelog-notes.mjs "$TAG" || true)"
          if [ -z "$NOTES" ]; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG" || true)"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          ARGS=(release create "$TAG" --notes-file "$NOTES_FILE" --verify-tag)
          if [[ "$TAG" == *-rc.* ]]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"

  publish-npm:
    name: publish-npm
    runs-on: ubuntu-latest
    needs:
      - verify-codegen
      - typescript
      - rust
      - verify-version
      - release
    if: ${{ !contains(inputs.tag || github.ref_name, '-rc.') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        # actions/setup-node@v4.4.0 — Node ≥22.14 required for npm Trusted Publishing (OIDC).
        # Do NOT set registry-url: it writes _authToken=${NODE_AUTH_TOKEN} into .npmrc and
        # blocks the OIDC exchange (npm then returns E404 on scoped publish).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable npm packages
        run: |
          pnpm -F @42ch/spoke-schemas build
          pnpm -F @42ch/spoke-operations build

      # Pack with pnpm (rewrites workspace:*), publish with npm CLI (OIDC Trusted Publisher).
      - name: Publish @42ch/spoke-schemas
        working-directory: packages/spoke-schemas
        run: |
          unset NODE_AUTH_TOKEN
          pnpm pack
          npm publish 42ch-spoke-schemas-*.tgz --access public

      - name: Publish @42ch/spoke-operations
        working-directory: packages/spoke-operations
        run: |
          unset NODE_AUTH_TOKEN
          pnpm pack
          npm publish 42ch-spoke-operations-*.tgz --access public

  publish-crates:
    name: publish-crates
    runs-on: ubuntu-latest
    needs:
      - publish-npm
    if: ${{ !contains(inputs.tag || github.ref_name, '-rc.') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      # Temporary crates.io token via OIDC Trusted Publishing; post step revokes it.
      - name: Authenticate to crates.io
        id: crates-io-auth
        # rust-lang/crates-io-auth-action@v1.0.5
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish spoke-schemas crate
        run: cargo publish -p spoke-schemas
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Publish spoke-operations crate
        run: cargo publish -p spoke-operations
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
