name: Release

# Top-level only so Trusted Publishing OIDC binds to workflow filename
# `release.yml` (mstar-harness pattern). Do not call this via workflow_call.
#
# Entry points:
#   - push tags v* (human/PAT tag push)
#   - pull_request closed on main with label `release` (tag + publish)
on:
  push:
    tags:
      - v*
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: read
  packages: write

jobs:
  tag:
    name: tag
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'release')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout merge commit
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve version and ensure annotated tag
        id: tag
        env:
          SUMMARY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TYPE="$(git cat-file -t "refs/tags/${TAG}")"
            if [ "$TYPE" != "tag" ]; then
              echo "::error::Tag ${TAG} exists but is not annotated."
              exit 1
            fi
            echo "Tag ${TAG} already exists; continuing Release."
          else
            MSG="Release ${TAG}"
            BODY_LINE="$(printf '%s\n' "$SUMMARY" | sed -n '/^[^#[:space:]].*/{p;q;}')"
            if [ -n "$BODY_LINE" ]; then
              MSG="$BODY_LINE"
            fi
            git tag -a "$TAG" -m "$MSG" "${{ github.event.pull_request.merge_commit_sha }}"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed ${TAG}"
          fi

      - name: Summary
        run: |
          echo "### Tagged release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge: \`${{ github.event.pull_request.merge_commit_sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  resolve-tag:
    name: resolve-tag
    runs-on: ubuntu-latest
    needs: [tag]
    if: >
      always() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'pull_request' && needs.tag.result == 'success')
      )
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            push)
              TAG="${{ github.ref_name }}"
              ;;
            pull_request)
              TAG="${{ needs.tag.outputs.tag }}"
              ;;
            *)
              echo "::error::Unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac
          if [ -z "$TAG" ]; then
            echo "::error::Empty release tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved RELEASE_TAG=${TAG}"

  verify-codegen:
    name: verify-codegen
    needs: [resolve-tag]
    # `tag` is skipped on push.tags; keep the graph alive when resolve-tag succeeds.
    if: ${{ always() && needs.resolve-tag.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify codegen output
        run: pnpm run verify-codegen

  typescript:
    name: typescript
    needs: [resolve-tag]
    if: ${{ always() && needs.resolve-tag.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas typecheck

      - name: Build @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas build

      - name: Typecheck @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations typecheck

      - name: Test @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations test

      - name: Test toy-world fixtures
        run: pnpm run test:fixtures

      - name: Build @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations build

      - name: Typecheck @42ch/spoke-connect
        run: pnpm -F @42ch/spoke-connect typecheck

      - name: Test @42ch/spoke-connect
        run: pnpm -F @42ch/spoke-connect test

      - name: Build @42ch/spoke-connect
        run: pnpm -F @42ch/spoke-connect build

  rust:
    name: rust
    needs: [resolve-tag]
    if: ${{ always() && needs.resolve-tag.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Check spoke-schemas crate
        run: cargo check -p spoke-schemas

      - name: Test spoke-operations crate
        run: cargo test -p spoke-operations

      - name: Test spoke-fixture-toy-world crate
        run: cargo test -p spoke-fixture-toy-world

      - name: Test spoke-connect crate
        run: cargo test -p spoke-connect

  verify-version:
    name: verify-version
    needs: [resolve-tag]
    if: ${{ always() && needs.resolve-tag.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Require annotated release tag
        run: |
          TAG="${RELEASE_TAG}"
          git fetch --tags --force origin
          TYPE="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "$TYPE" != "tag" ]; then
            echo "::error::Release tag ${TAG} must be an annotated tag (git tag -a), not a lightweight tag."
            echo "Found object type: ${TYPE} (expected: tag)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Assert lockstep package versions
        env:
          SPOKE_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: node tooling/release/assert-lockstep-version.mjs

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - verify-codegen
      - typescript
      - rust
      - verify-version
    if: ${{ always() && needs.resolve-tag.result == 'success' && needs.verify-codegen.result == 'success' && needs.typescript.result == 'success' && needs.rust.result == 'success' && needs.verify-version.result == 'success' }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release notes
        id: notes
        run: |
          TAG="${RELEASE_TAG}"
          BODY="$(node tooling/release/extract-changelog-notes.mjs "$TAG" || true)"
          if [ -z "$BODY" ]; then
            BODY="$(git tag -l --format='%(contents)' "$TAG" || true)"
          fi
          if [ -z "$BODY" ]; then
            BODY="Release $TAG"
          fi
          {
            echo "body<<EOF"
            printf '%s\n' "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # softprops/action-gh-release@v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc.') }}

  publish-npm:
    name: publish-npm
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - verify-codegen
      - typescript
      - rust
      - verify-version
      - release
    if: ${{ always() && needs.resolve-tag.result == 'success' && needs.release.result == 'success' && !contains(needs.resolve-tag.outputs.tag, '-rc.') }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11

      # Node 24 + registry-url; use stock npm (do not npm install -g).
      - name: Setup Node.js
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable npm packages
        run: |
          pnpm -F @42ch/spoke-schemas build
          pnpm -F @42ch/spoke-operations build
          pnpm -F @42ch/spoke-connect build

      # Pack with pnpm (rewrites workspace:*), publish with npm CLI (OIDC Trusted Publisher).
      - name: Publish @42ch/spoke-schemas
        run: ./tooling/release/publish-npm.sh packages/spoke-schemas @42ch/spoke-schemas

      - name: Publish @42ch/spoke-operations
        run: ./tooling/release/publish-npm.sh packages/spoke-operations @42ch/spoke-operations

      - name: Publish @42ch/spoke-connect
        run: ./tooling/release/publish-npm.sh packages/spoke-connect-ts @42ch/spoke-connect

  publish-crates:
    name: publish-crates
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - publish-npm
    if: ${{ always() && needs.publish-npm.result == 'success' && !contains(needs.resolve-tag.outputs.tag, '-rc.') }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      # crates.io Trusted Publishing — short-lived token; post step revokes it.
      - name: Authenticate to crates.io
        id: crates-io-auth
        # rust-lang/crates-io-auth-action@v1.0.5
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish spoke-schemas crate
        run: ./tooling/release/publish-crate.sh spoke-schemas
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Publish spoke-operations crate
        run: ./tooling/release/publish-crate.sh spoke-operations
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Publish spoke-connect crate
        run: ./tooling/release/publish-crate.sh spoke-connect
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  build-connect-ffi:
    name: build-connect-ffi (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs:
      - resolve-tag
      - verify-codegen
      - typescript
      - rust
      - verify-version
      - release
    if: ${{ always() && needs.resolve-tag.result == 'success' && needs.release.result == 'success' && !contains(needs.resolve-tag.outputs.tag, '-rc.') }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            lib: libspoke_connect.so
          - os: windows-latest
            rid: win-x64
            lib: spoke_connect.dll
          - os: macos-14
            rid: osx-arm64
            lib: libspoke_connect.dylib
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-connect-ffi-${{ matrix.rid }}
          workspaces: .

      - name: Build spoke-connect FFI (release)
        run: cargo build -p spoke-connect --features ffi,remote-adapter --release

      - name: Stage RID native
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          SRC="${TARGET_DIR}/release/${{ matrix.lib }}"
          if [[ ! -f "${SRC}" ]]; then
            echo "missing ${SRC}" >&2
            exit 1
          fi
          mkdir -p "ffi-stage/${{ matrix.rid }}"
          cp "${SRC}" "ffi-stage/${{ matrix.rid }}/${{ matrix.lib }}"
          ls -la "ffi-stage/${{ matrix.rid }}"

      - name: Upload FFI artifact
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffi-${{ matrix.rid }}
          path: ffi-stage/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 5

  publish-nuget:
    name: publish-nuget
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - build-connect-ffi
    if: ${{ always() && needs.resolve-tag.result == 'success' && needs.build-connect-ffi.result == 'success' && !contains(needs.resolve-tag.outputs.tag, '-rc.') }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download FFI artifacts
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ffi-*
          path: ffi-artifacts
          merge-multiple: false

      - name: Assemble NuGet runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ffi-assembled
          for d in ffi-artifacts/ffi-*; do
            rid="${d##*/ffi-}"
            mkdir -p "ffi-assembled/${rid}"
            cp -R "${d}/." "ffi-assembled/${rid}/"
          done
          ls -laR ffi-assembled
          ./tooling/connect/assemble-csharp-runtimes.sh ffi-assembled

      - name: Setup .NET
        # actions/setup-dotnet@v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Pack 42ch.Spoke.Connect
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          dotnet pack crates/spoke-connect/bindings/csharp/42ch.Spoke.Connect.csproj \
            -c Release \
            -o nuget-out \
            -p:Version="${VERSION}" \
            -p:PackageVersion="${VERSION}"

      - name: Push to GitHub Packages
        run: |
          set -euo pipefail
          dotnet nuget push nuget-out/*.nupkg \
            --source "https://nuget.pkg.github.com/42ch-dev/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

  publish-pypi:
    name: publish-pypi
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - build-connect-ffi
    if: ${{ always() && needs.resolve-tag.result == 'success' && needs.build-connect-ffi.result == 'success' && !contains(needs.resolve-tag.outputs.tag, '-rc.') }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pre-check published set on PyPI
        id: check-pypi
        run: node tooling/release/check-pypi-published.mjs

      - name: Download FFI artifacts
        # actions/download-artifact@v4.3.0
        if: steps.check-pypi.outputs.publish_needed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ffi-*
          path: ffi-artifacts
          merge-multiple: false

      - name: Assemble FFI natives for wheel build
        if: steps.check-pypi.outputs.publish_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ffi-assembled
          for d in ffi-artifacts/ffi-*; do
            rid="${d##*/ffi-}"
            mkdir -p "ffi-assembled/${rid}"
            cp -R "${d}/." "ffi-assembled/${rid}/"
          done
          ls -laR ffi-assembled

      - name: Setup Python
        # actions/setup-python@v5.4.0
        if: steps.check-pypi.outputs.publish_needed == 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install wheel tooling
        if: steps.check-pypi.outputs.publish_needed == 'true'
        run: python -m pip install setuptools wheel

      - name: Build platform wheels
        if: steps.check-pypi.outputs.publish_needed == 'true'
        run: ./tooling/connect/build-python-wheels-from-ffi.sh ffi-assembled

      - name: Verify wheel inventory
        if: steps.check-pypi.outputs.publish_needed == 'true'
        run: ./tooling/connect/verify-python-wheels.sh

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish@v1.14.2 — pin peeled commit (GHCR image tag), not annotated-tag object SHA
        # Trusted Publishing OIDC (Pending publisher: spoke-connect)
        # skip-existing is the per-file duplicate guard only (default false): it makes a
        # partial-set resume upload tolerate already-present wheels. The pre-check owns
        # skip/partial/fail-loud semantics and the Confirm step decides green — never here.
        if: steps.check-pypi.outputs.publish_needed == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: crates/spoke-connect/bindings/python/dist/
          print-hash: true
          skip-existing: true

      - name: Confirm published set on PyPI
        # Unconditional re-probe: the job is green only on a verified full set,
        # skip and publish paths alike.
        if: ${{ always() }}
        run: node tooling/release/check-pypi-published.mjs --verify

  publish-maven:
    name: publish-maven
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - build-connect-ffi
    if: ${{ always() && needs.resolve-tag.result == 'success' && needs.build-connect-ffi.result == 'success' && !contains(needs.resolve-tag.outputs.tag, '-rc.') }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pre-check published set on GitHub Packages Maven
        # Primary skip gate (architect-locked): full set present (pom + module
        # + jar with the three JNA entries) -> publish_needed=false. Absent /
        # partial -> publish_needed=true. Doubt (auth, network, bad payload)
        # fails the job — never skip on doubt.
        id: check-maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/release/check-maven-published.mjs

      - name: Download FFI artifacts
        # actions/download-artifact@v4.3.0
        if: steps.check-maven.outputs.publish_needed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ffi-*
          path: ffi-artifacts
          merge-multiple: false

      - name: Assemble Kotlin JNA resources
        if: steps.check-maven.outputs.publish_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ffi-assembled
          for d in ffi-artifacts/ffi-*; do
            rid="${d##*/ffi-}"
            mkdir -p "ffi-assembled/${rid}"
            cp -R "${d}/." "ffi-assembled/${rid}/"
          done
          ls -laR ffi-assembled
          ./tooling/connect/assemble-kotlin-natives.sh ffi-assembled

      - name: Setup Java
        # actions/setup-java@v4.7.0
        if: steps.check-maven.outputs.publish_needed == 'true'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        # gradle/actions/setup-gradle@v4.4.2
        if: steps.check-maven.outputs.publish_needed == 'true'
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: "9.6.1"

      # Gradle has no --skip-duplicate: a duplicate artifact fails with 409, so
      # on a partial set we still attempt the whole publish (it may upload the
      # missing files before hitting a duplicate), then the Confirm step below
      # decides green. If still partial afterwards: delete the package version
      # in the GitHub Packages UI and re-run (no automated registry deletion).
      - name: Publish to GitHub Packages Maven
        if: steps.check-maven.outputs.publish_needed == 'true'
        working-directory: crates/spoke-connect/bindings/kotlin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gradle publish \
            -Pgpr.user="${{ github.actor }}" \
            -Pgpr.key="${GITHUB_TOKEN}"

      - name: Confirm published set on GitHub Packages Maven
        # Unconditional re-probe: the job is green only on a verified full set,
        # skip and publish paths alike.
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/release/check-maven-published.mjs --verify
