name: Release

# Single top-level workflow so npm/crates Trusted Publishing OIDC sees workflow
# filename `release.yml` (same pattern as mstar-harness). Do not wrap this file
# in workflow_call — the caller's name would become the OIDC workflow claim.
#
# Entry points:
#   - push tags v* (human/PAT tag push)
#   - pull_request closed on main with label `release` (tag + publish)
#   - workflow_dispatch with tag (recovery re-run)
on:
  push:
    tags:
      - v*
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated tag to (re)publish (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.tag || github.ref }}
  cancel-in-progress: true

# Match mstar-harness: workflow-level id-token for Trusted Publishing.
permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  tag:
    name: tag
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'release')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout merge commit
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve version and ensure annotated tag
        id: tag
        env:
          SUMMARY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TYPE="$(git cat-file -t "refs/tags/${TAG}")"
            if [ "$TYPE" != "tag" ]; then
              echo "::error::Tag ${TAG} exists but is not annotated."
              exit 1
            fi
            echo "Tag ${TAG} already exists; continuing Release."
          else
            MSG="Release ${TAG}"
            BODY_LINE="$(printf '%s\n' "$SUMMARY" | sed -n '/^[^#[:space:]].*/{p;q;}')"
            if [ -n "$BODY_LINE" ]; then
              MSG="$BODY_LINE"
            fi
            git tag -a "$TAG" -m "$MSG" "${{ github.event.pull_request.merge_commit_sha }}"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed ${TAG}"
          fi

      - name: Summary
        run: |
          echo "### Tagged release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge: \`${{ github.event.pull_request.merge_commit_sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  resolve-tag:
    name: resolve-tag
    runs-on: ubuntu-latest
    needs: [tag]
    if: >
      always() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.tag.result == 'success')
      )
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              TAG="${{ inputs.tag }}"
              ;;
            push)
              TAG="${{ github.ref_name }}"
              ;;
            pull_request)
              TAG="${{ needs.tag.outputs.tag }}"
              ;;
            *)
              echo "::error::Unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac
          if [ -z "$TAG" ]; then
            echo "::error::Empty release tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved RELEASE_TAG=${TAG}"

  verify-codegen:
    name: verify-codegen
    needs: [resolve-tag]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify codegen output
        run: pnpm run verify-codegen

  typescript:
    name: typescript
    needs: [resolve-tag]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas typecheck

      - name: Build @42ch/spoke-schemas
        run: pnpm -F @42ch/spoke-schemas build

      - name: Typecheck @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations typecheck

      - name: Test @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations test

      - name: Test toy-world fixtures
        run: pnpm run test:fixtures

      - name: Build @42ch/spoke-operations
        run: pnpm -F @42ch/spoke-operations build

  rust:
    name: rust
    needs: [resolve-tag]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust
          workspaces: .

      - name: Check spoke-schemas crate
        run: cargo check -p spoke-schemas

      - name: Test spoke-operations crate
        run: cargo test -p spoke-operations

  verify-version:
    name: verify-version
    needs: [resolve-tag]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Require annotated release tag
        run: |
          TAG="${RELEASE_TAG}"
          git fetch --tags --force origin
          TYPE="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "$TYPE" != "tag" ]; then
            echo "::error::Release tag ${TAG} must be an annotated tag (git tag -a), not a lightweight tag."
            echo "Found object type: ${TYPE} (expected: tag)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assert lockstep package versions
        env:
          SPOKE_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: node tooling/release/assert-lockstep-version.mjs

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - verify-codegen
      - typescript
      - rust
      - verify-version
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create GitHub Release
        # Idempotent for workflow_dispatch re-runs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; leaving notes unchanged."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          NOTES="$(node tooling/release/extract-changelog-notes.mjs "$TAG" || true)"
          if [ -z "$NOTES" ]; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG" || true)"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          ARGS=(release create "$TAG" --notes-file "$NOTES_FILE" --verify-tag)
          if [[ "$TAG" == *-rc.* ]]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"

  publish-npm:
    name: publish-npm
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - verify-codegen
      - typescript
      - rust
      - verify-version
      - release
    if: ${{ !contains(needs.resolve-tag.outputs.tag, '-rc.') }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9

      # Match mstar-harness Trusted Publishing:
      # Node 24 ships working npm OIDC/provenance — do not `npm install -g npm@…`.
      # Keep registry-url (same as mstar); OIDC works when this workflow is top-level.
      - name: Setup Node.js
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable npm packages
        run: |
          pnpm -F @42ch/spoke-schemas build
          pnpm -F @42ch/spoke-operations build

      # Pack with pnpm (rewrites workspace:*), publish with npm CLI (OIDC Trusted Publisher).
      - name: Publish @42ch/spoke-schemas
        working-directory: packages/spoke-schemas
        run: |
          pnpm pack
          npm publish 42ch-spoke-schemas-*.tgz --access public

      - name: Publish @42ch/spoke-operations
        working-directory: packages/spoke-operations
        run: |
          pnpm pack
          npm publish 42ch-spoke-operations-*.tgz --access public

  publish-crates:
    name: publish-crates
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - publish-npm
    if: ${{ !contains(needs.resolve-tag.outputs.tag, '-rc.') }}
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@stable (2026-07-16)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      # Temporary crates.io token via OIDC Trusted Publishing; post step revokes it.
      - name: Authenticate to crates.io
        id: crates-io-auth
        # rust-lang/crates-io-auth-action@v1.0.5
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish spoke-schemas crate
        run: cargo publish -p spoke-schemas
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Publish spoke-operations crate
        run: cargo publish -p spoke-operations
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
