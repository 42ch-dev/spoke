name: Retry release

# Re-run Release for an existing annotated tag (recovery after a failed publish).
# Prefer New release → merge for normal cuts. Does not create or move tags.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
