name: Xcframework

# Build the three-slice xcframework from source and exercise the committed
# consumer package. Every pull request runs this required check.
on:
  pull_request:
  push:
    branches:
      - main
      - iteration/**
    paths-ignore:
      - 'docs/**'
      - 'tooling/docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: xcframework-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      rebuild: ${{ steps.detect.outputs.rebuild }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: detect
        env:
          # Source and recipe files whose change invalidates the committed
          # xcframework. Prefix alternatives have no `$`; exact files do.
          REBUILD_PATTERN: >-
            ^(Cargo\.toml$|Cargo\.lock$|\.cargo/|rust-toolchain(\.toml)?$|crates/spoke-connect/|crates/spoke-schemas/|crates/spoke-operations/|tooling/connect/build-swift-xcframework\.sh$|tooling/connect/xcframework-manifest\.sh$|tooling/connect/normalize-cargo-version\.mjs$|tooling/release/lockstep-surfaces\.mjs$|\.github/workflows/xcframework\.yml$)
        run: |
          code=false
          rebuild=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            code=true
            rebuild=true
          # --no-renames: a file moved out of a rebuild prefix still reports
          # its old path, so the prefix keeps triggering the rebuild.
          elif ! files=$(git diff --no-renames --name-only "origin/${{ github.base_ref }}"...HEAD); then
            # Fail closed: a diff failure must never be read as "docs only".
            code=true
            rebuild=true
          else
            if printf '%s\n' "$files" | grep -vqE '^(docs/|tooling/docs/|.*\.md$|\.mstarc$)'; then
              code=true
            fi
            if printf '%s\n' "$files" | grep -qE "$REBUILD_PATTERN"; then
              rebuild=true
            fi
          fi
          # Rebuild implies code: a Markdown file inside a rebuild prefix
          # (for example crates/spoke-connect/README.md) matches the rebuild
          # pattern while the code regex classifies it as docs.
          if [[ "$rebuild" == "true" ]]; then
            code=true
          fi
          echo "code=$code"       >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "code=$code rebuild=$rebuild" >> "$GITHUB_STEP_SUMMARY"

  xcframework:
    needs: changes
    name: xcframework
    # Never a condition that can evaluate false: a skipped required job
    # satisfies the required check without proving anything.
    if: ${{ always() }}
    runs-on: macos-15
    steps:
      - name: Assert changes gate inputs
        id: assert
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          REBUILD: ${{ needs.changes.outputs.rebuild }}
        run: |
          problems=()
          [[ "${CHANGES}" == "success" ]] || problems+=("changes job result=${CHANGES}")
          [[ "${CODE}"    == "true" || "${CODE}"    == "false" ]] || problems+=("missing/empty code output '${CODE}'")
          [[ "${REBUILD}" == "true" || "${REBUILD}" == "false" ]] || problems+=("missing/empty rebuild output '${REBUILD}'")
          if [[ "${REBUILD}" == "true" && "${CODE}" != "true" ]]; then
            problems+=("illegal combination rebuild=true code=${CODE}")
          fi
          if (( ${#problems[@]} )); then
            printf 'assert: %s\n' "${problems[@]}" >&2
            { echo "### Required-check assertion failed"; printf -- '- %s\n' "${problems[@]}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        # actions/checkout@v4.2.2 — fetch the committed LFS libraries.
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true

      - name: Setup Rust toolchain (pinned exact stable + Apple targets)
        # dtolnay/rust-toolchain@stable (2026-07-16), pinned for the build.
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.rebuild == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Cache Rust dependencies
        # Swatinem/rust-cache@v2.9.1
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.rebuild == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: spoke-rust-xcframework
          workspaces: .

      - name: Run committed Swift consumer smoke
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.code == 'true'
        id: committed_smoke
        continue-on-error: true
        run: |
          swift build
          swiftc -Xcc -fmodule-map-file="$PWD/crates/spoke-connect/bindings/swift/generated/spoke_connectFFI.modulemap" \
            -swift-version 5 \
            -o "${RUNNER_TEMP}/swift-smoke" \
            crates/spoke-connect/bindings/swift/Smoke/main.swift \
            crates/spoke-connect/bindings/swift/Smoke/tool_loopback_smoke.swift \
            crates/spoke-connect/bindings/swift/Smoke/ports_loopback_smoke.swift \
            crates/spoke-connect/bindings/swift/Smoke/loopback_transport.swift \
            crates/spoke-connect/bindings/swift/generated/spoke_connect.swift \
            crates/spoke-connect/bindings/swift/xcframework/spoke_connectFFI.xcframework/macos-arm64/libspoke_connect.a
          "${RUNNER_TEMP}/swift-smoke"

      - name: Build Swift xcframework (staged, locked)
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.rebuild == 'true'
        # Preserve the committed consumer package; --locked pins Cargo.lock.
        env:
          XCFRAMEWORK_LOCKED: "1"
          XCFRAMEWORK_OUTPUT_DIR: ${{ runner.temp }}/xcframework-stage
        run: ./tooling/connect/build-swift-xcframework.sh

      - name: Write xcframework hash manifest
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.rebuild == 'true'
        # The apply script verifies the transferred artifact against this manifest.
        run: |
          ./tooling/connect/xcframework-manifest.sh \
            "${{ runner.temp }}/xcframework-stage/spoke_connectFFI.xcframework" \
            > "${{ runner.temp }}/xcframework-stage/spoke_connectFFI.xcframework.sha256"

      - name: Record xcframework build provenance
        if: steps.assert.outputs.ok == 'true' && needs.changes.outputs.rebuild == 'true'
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -n \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg head "${SOURCE_HEAD}" \
            --arg checkout "$(git rev-parse HEAD)" \
            --arg rustc "$(rustc -Vv)" \
            --rawfile hashes "${RUNNER_TEMP}/xcframework-stage/spoke_connectFFI.xcframework.sha256" \
            '{evidence: "ci-artifact", run: $run, sourceHead: $head, checkoutRevision: $checkout, rustcVersion: $rustc, manifest: $hashes}' \
            > "${RUNNER_TEMP}/xcframework-stage/provenance.json"



      - name: Upload xcframework artifact
        # actions/upload-artifact@v4.6.2
        if: always() && steps.assert.outputs.ok == 'true' && needs.changes.outputs.rebuild == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spoke-connect-xcframework
          path: ${{ runner.temp }}/xcframework-stage
          if-no-files-found: error
          retention-days: 5

      - name: Fail on committed Swift consumer smoke
        if: always() && steps.committed_smoke.outcome == 'failure'
        run: exit 1
