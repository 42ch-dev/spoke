name: Xcframework

# Build the three-slice xcframework from source and exercise the committed
# consumer package. Every pull request runs this required check.
on:
  pull_request:
  push:
    branches:
      - main
      - iteration/**
    paths:
      - crates/spoke-connect/src/**
      - crates/spoke-connect/uniffi-bindgen.rs
      - crates/spoke-connect/Cargo.toml
      - Cargo.lock
      - tooling/connect/build-swift-xcframework.sh
      - tooling/connect/verify-xcframework-drift.sh
      - crates/spoke-connect/bindings/swift/generated/**
      - crates/spoke-connect/bindings/swift/Smoke/**
      - Package.swift
      - .github/workflows/xcframework.yml
  workflow_dispatch:

concurrency:
  group: xcframework-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xcframework:
    name: xcframework
    runs-on: macos-15
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2 — fetch the committed LFS libraries.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true

      - name: Setup Rust toolchain (pinned exact stable + Apple targets)
        # dtolnay/rust-toolchain@stable (2026-07-16), pinned for the build.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Run committed Swift consumer smoke
        id: committed_smoke
        continue-on-error: true
        run: |
          swift build
          swiftc -Xcc -fmodule-map-file="$PWD/crates/spoke-connect/bindings/swift/generated/spoke_connectFFI.modulemap" \
            -swift-version 5 \
            -o "${RUNNER_TEMP}/swift-smoke" \
            crates/spoke-connect/bindings/swift/Smoke/main.swift \
            crates/spoke-connect/bindings/swift/Smoke/tool_loopback_smoke.swift \
            crates/spoke-connect/bindings/swift/Smoke/ports_loopback_smoke.swift \
            crates/spoke-connect/bindings/swift/Smoke/loopback_transport.swift \
            crates/spoke-connect/bindings/swift/generated/spoke_connect.swift \
            crates/spoke-connect/bindings/swift/xcframework/spoke_connectFFI.xcframework/macos-arm64/libspoke_connect.a
          "${RUNNER_TEMP}/swift-smoke"

      - name: Build Swift xcframework (staged, locked)
        # Preserve the committed consumer package; --locked pins Cargo.lock.
        env:
          XCFRAMEWORK_LOCKED: "1"
          XCFRAMEWORK_OUTPUT_DIR: ${{ runner.temp }}/xcframework-stage
        run: ./tooling/connect/build-swift-xcframework.sh

      - name: Write xcframework hash manifest
        # The apply script verifies the transferred artifact against this manifest.
        run: |
          ./tooling/connect/verify-xcframework-drift.sh --manifest \
            "${{ runner.temp }}/xcframework-stage/spoke_connectFFI.xcframework" \
            > "${{ runner.temp }}/xcframework-stage/spoke_connectFFI.xcframework.sha256"

      - name: Record xcframework build provenance
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -n \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg head "${SOURCE_HEAD}" \
            --arg checkout "$(git rev-parse HEAD)" \
            --arg rustc "$(rustc -Vv)" \
            --rawfile hashes "${RUNNER_TEMP}/xcframework-stage/spoke_connectFFI.xcframework.sha256" \
            '{evidence: "ci-artifact", run: $run, sourceHead: $head, checkoutRevision: $checkout, rustcVersion: $rustc, manifest: $hashes}' \
            > "${RUNNER_TEMP}/xcframework-stage/provenance.json"



      - name: Upload xcframework artifact
        # actions/upload-artifact@v4.6.2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spoke-connect-xcframework
          path: ${{ runner.temp }}/xcframework-stage
          if-no-files-found: error
          retention-days: 5

      - name: Fail on committed Swift consumer smoke
        if: always() && steps.committed_smoke.outcome == 'failure'
        run: exit 1
