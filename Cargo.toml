[workspace]
members = [
  "crates/spoke-schemas",
  "crates/spoke-operations",
  "crates/spoke-connect",
  "fixtures/toy-world/rust",
]
resolver = "2"

[workspace.package]
version = "0.8.2"
edition = "2021"
authors = ["42ch"]
license = "Apache-2.0"
repository = "https://github.com/42ch-dev/spoke"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regress = "0.10"
thiserror = "2"
libp2p = { version = "=0.56.0", features = ["noise", "yamux", "tcp", "tokio", "identify", "request-response", "json", "macros", "ed25519"] }
