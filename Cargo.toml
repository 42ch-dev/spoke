[workspace]
members = [
  "crates/spoke-schemas",
  "crates/spoke-operations",
  "crates/spoke-connect",
  "crates/spoke-connect-capi",
  "fixtures/toy-world/rust",
]
# Default selection stays on the four product members; the C ABI carrier is
# built explicitly (`-p spoke-connect-capi`) so ordinary workspace commands do
# not produce native binding artifacts.
default-members = [
  "crates/spoke-schemas",
  "crates/spoke-operations",
  "crates/spoke-connect",
  "fixtures/toy-world/rust",
]
resolver = "2"

[workspace.package]
version = "0.13.0"
edition = "2021"
authors = ["42ch"]
license = "Apache-2.0"
repository = "https://github.com/42ch-dev/spoke"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regress = "0.10"
thiserror = "2"
async-trait = "0.1"
pollster = "0.4"
libp2p = { version = "=0.56.0", features = ["noise", "yamux", "tcp", "tokio", "identify", "request-response", "json", "macros", "ed25519"] }
