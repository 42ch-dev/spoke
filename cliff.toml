# git-cliff configuration — SPOKE release changelog
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Release notes for GitHub Releases are extracted from the matching version section here.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}){% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/42ch-dev/spoke" },
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
ignore_merges = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\\((\\w+\\s)?#([0-9]+)\\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
commit_parsers = [
  # Morning Star harness process ids — omit from consumer-facing release notes
  { message = "(?i)v0-iter", skip = true },
  { message = "(?i)iteration/v0-iter", skip = true },
  # Plan merge-only integration lines (no product delta)
  { message = "(?i)merge\\(plan\\)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^docs?", group = "Documentation" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^test", group = "Changed" },
  { message = "^revert", group = "Changed" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(plan\\)", skip = true },
  { message = "^chore\\(protocol\\)", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^chore: add Greptile", skip = true },
  { message = "^merge:", skip = true },
  { message = "^[Mm]erge ", skip = true },
  { message = "^ci", group = "Internal" },
  { message = "^chore", group = "Internal" },
]
filter_commits = false
fail_on_unmatched_commit = false
