[package]
name = "spoke-connect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SPOKE Connect reference spike — libp2p transport, noise-peerid authenticated hello, explicit peering"
# Path B language bindings (C# / Go / Kotlin / Python / Swift) ship on their
# own channels — not crates.io. Exclude the whole tree so natives and binding
# sources stay out of the crate tarball (including them bloated the package
# and tripped crates.io upload failures).
exclude = ["bindings/**", "examples/**"]

[dependencies]
spoke-schemas = { version = "0.9.2", path = "../spoke-schemas" }
# RemoteAdapter (the `remote-adapter` feature) implements the operations
# BaselinePorts + SpokeResult types; optional so default connect builds stay
# lean (TS equivalent: the `./remote` subpath export).
spoke-operations = { version = "0.9.2", path = "../spoke-operations", optional = true }
# Loopback smoke host (RemoteAdapter FFI binding smokes; `ffi-smoke-host` only).
libp2p.workspace = true
serde.workspace = true
serde_json.workspace = true
# Session snapshots carry RFC 3339 timestamps (`ConnectSession.opened_at`);
# the envelope-auth sign input names the schema's chrono DateTime type.
chrono.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
serde_jcs = "0.2"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
# FFI facade only — pulled in by the non-default `ffi` feature so default
# builds and tests stay lean (no binding surface in the default artifact).
uniffi = { version = "0.32.0", optional = true }

[features]
default = []
# RemoteAdapter + message-oriented Transport (opt-in): the remote module
# implements the async BaselinePorts by proxying port.* ops over a connect
# session (contract §9 — feature-gated so default connect builds do not
# depend on spoke-operations; TS equivalent is the `./remote` subpath).
remote-adapter = ["dep:spoke-operations"]
# Loopback smoke host FFI (binding smokes only — NOT implied by remote-adapter or ffi).
ffi-smoke-host = ["remote-adapter"]
# Exports the sync-core facade through uniffi (see src/ffi.rs). Non-default:
# `cargo test -p spoke-connect` keeps compiling without the binding surface.
ffi = ["dep:uniffi", "tokio/rt-multi-thread"]
# Builds the crate-local `uniffi-bindgen` CLI binary (uniffi 0.32 pattern —
# no installable CLI crate on this line). Generation target only; the
# exported-surface metadata is read from the cdylib built with `ffi`.
bindgen-cli = ["uniffi/cli"]

[lib]
# The cdylib target feeds `uniffi-bindgen generate --library` (Swift/C# bindings);
# the crate is published (consumers linking the bindings also build the cdylib).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

# Dev-only (examples/ only — excluded from the crate tarball via `exclude`):
# the Noise XX golden-transcript recorder (`examples/noise_recorder.rs`)
# drives the exact engine behind libp2p-noise 0.46.1 — snow 0.9.6 with the
# `ring-resolver` feature libp2p-noise itself requests — plus libp2p-identity
# for the identity payload signing and x25519-dalek for static-key public
# derivation. None of these enter the published surface.
[dev-dependencies]
snow = { version = "0.9.6", default-features = false, features = ["ring-resolver"] }
libp2p-identity = "0.2"
# X25519 DH — the same `x25519`/`X25519_BASEPOINT_BYTES` primitives
# libp2p-noise's own snow DH impl uses.
x25519-dalek = "2"
# RemoteAdapter loopback interop test: the host serves a reference
# ToyWorldAdapter, and the dial fixture derives peer ids from raw seeds.
ed25519-dalek = "2"
# Loopback host emits schema-v2 signed post-hello envelopes (session
# snapshot + invoke responses) with the same RFC 8785 JCS canonicalization
# the core `authenticate_*` helpers use (envelope-auth contract §3/§5).
serde_jcs = "0.2"
# Loopback / remote-adapter integration tests and in-crate test_support oracle.
spoke-fixture-toy-world = { path = "../../fixtures/toy-world/rust" }

