[package]
name = "spoke-connect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SPOKE Connect reference spike — libp2p transport, noise-peerid authenticated hello, explicit peering"

[dependencies]
spoke-schemas = { version = "0.8.0", path = "../spoke-schemas" }
libp2p.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
serde_jcs = "0.2"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
# FFI facade only — pulled in by the non-default `ffi` feature so default
# builds and tests stay lean (no binding surface in the default artifact).
uniffi = { version = "0.32.0", optional = true }

[features]
default = []
# Same-LAN discovery convenience (non-default): wires libp2p's mDNS
# behaviour into the node. Discovery only — it never grants trust:
# discovered peers still pass the allowlist + signed-hello gates, and
# auto-dials reuse the same pending-connect machinery as explicit
# `connect(addr)` calls.
mdns = ["libp2p/mdns"]
# Exports the sync-core facade through uniffi (see src/ffi.rs). Non-default:
# `cargo test -p spoke-connect` keeps compiling without the binding surface.
ffi = ["dep:uniffi"]
# Builds the crate-local `uniffi-bindgen` CLI binary (uniffi 0.32 pattern —
# no installable CLI crate on this line). Generation target only; the
# exported-surface metadata is read from the cdylib built with `ffi`.
bindgen-cli = ["uniffi/cli"]

[lib]
# The cdylib target feeds `uniffi-bindgen generate --library` (Swift/C# bindings);
# the crate is published (consumers linking the bindings also build the cdylib).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

