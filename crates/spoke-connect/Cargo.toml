[package]
name = "spoke-connect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SPOKE Connect reference spike — libp2p transport, noise-peerid authenticated hello, explicit peering"
# Path B language bindings (C# / Go / Kotlin / Python / Swift) ship on their
# own channels — not crates.io. Exclude the whole tree so natives and binding
# sources stay out of the crate tarball (including them bloated the package
# and tripped crates.io upload failures).
exclude = ["bindings/**", "examples/**"]

[dependencies]
spoke-schemas = { version = "0.8.2", path = "../spoke-schemas" }
libp2p.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
serde_jcs = "0.2"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
# FFI facade only — pulled in by the non-default `ffi` feature so default
# builds and tests stay lean (no binding surface in the default artifact).
uniffi = { version = "0.32.0", optional = true }

[features]
default = []
# Same-LAN discovery convenience (non-default): wires libp2p's mDNS
# behaviour into the node. Discovery only — it never grants trust:
# discovered peers still pass the allowlist + signed-hello gates, and
# auto-dials reuse the same pending-connect machinery as explicit
# `connect(addr)` calls.
mdns = ["libp2p/mdns"]
# Exports the sync-core facade through uniffi (see src/ffi.rs). Non-default:
# `cargo test -p spoke-connect` keeps compiling without the binding surface.
ffi = ["dep:uniffi"]
# Builds the crate-local `uniffi-bindgen` CLI binary (uniffi 0.32 pattern —
# no installable CLI crate on this line). Generation target only; the
# exported-surface metadata is read from the cdylib built with `ffi`.
bindgen-cli = ["uniffi/cli"]

[lib]
# The cdylib target feeds `uniffi-bindgen generate --library` (Swift/C# bindings);
# the crate is published (consumers linking the bindings also build the cdylib).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

# Dev-only (examples/ only — excluded from the crate tarball via `exclude`):
# the Noise XX golden-transcript recorder (`examples/noise_recorder.rs`)
# drives the exact engine behind libp2p-noise 0.46.1 — snow 0.9.6 with the
# `ring-resolver` feature libp2p-noise itself requests — plus libp2p-identity
# for the identity payload signing and x25519-dalek for static-key public
# derivation. None of these enter the published surface.
[dev-dependencies]
snow = { version = "0.9.6", default-features = false, features = ["ring-resolver"] }
libp2p-identity = "0.2"
# X25519 DH — the same `x25519`/`X25519_BASEPOINT_BYTES` primitives
# libp2p-noise's own snow DH impl uses.
x25519-dalek = "2"

